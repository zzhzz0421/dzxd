<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出库记录解析器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.5/lz-string.min.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    max-width: 600px;
    width: 100%;
}

.panel {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
    font-size: 24px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
}

.info-box {
    background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #e8ebff;
}

.info-box p {
    color: #555;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 8px;
}

.info-box strong {
    color: #667eea;
}

.input-section {
    margin-bottom: 20px;
}

.input-section label {
    display: block;
    margin-bottom: 10px;
    color: #333;
    font-weight: 600;
    font-size: 15px;
}

.textarea-wrapper {
    position: relative;
}

textarea {
    width: 100%;
    min-height: 200px;
    padding: 16px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    background: #fafafa;
    transition: all 0.3s ease;
}

textarea:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

textarea::placeholder {
    color: #aaa;
    font-size: 13px;
}

.btn {
    padding: 16px 32px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    width: 100%;
    letter-spacing: 1px;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.file-info {
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
}

.file-info.show {
    display: block;
}

.file-info h3 {
    color: #333;
    margin-bottom: 10px;
    font-size: 16px;
}

.file-info p {
    color: #555;
    font-size: 13px;
    margin-bottom: 5px;
}

.error-box {
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
}

.error-box.show {
    display: block;
}

.error-box p {
    color: #c0392b;
    font-size: 14px;
    font-weight: 500;
}

.hint {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 20px;
}

.hint a {
    color: #667eea;
    text-decoration: none;
}

.hint a:hover {
    text-decoration: underline;
}

@media (min-width: 600px) {
    .panel {
        padding: 50px 40px;
    }

    h1 {
        font-size: 28px;
    }

    .btn {
        width: auto;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>📥 出库记录解析器</h1>
            <p class="subtitle">解析分享的出库记录，一键下载 Excel 文件</p>

            <div class="info-box" id="infoBox">
                <p>📌 <strong>使用说明：</strong></p>
                <p>1. 点击分享链接后，页面会自动解析数据</p>
                <p>2. 解析成功后点击"下载Excel"按钮保存文件</p>
                <p>3. 如自动解析失败，可手动粘贴数据重试</p>
            </div>

            <div class="input-section" id="inputSection" style="display: none;">
                <label>📝 手动粘贴数据</label>
                <div class="textarea-wrapper">
                    <textarea id="base64Input" placeholder="粘贴分享链接中的数据部分..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="parseAndDownload()" style="width: 100%; margin-top: 12px;">🔍 解析数据</button>
            </div>

            <div class="file-info" id="fileInfo">
                <h3>✅ 记录解析成功</h3>
                <p id="fileName">文件名：</p>
                <p id="fileSize">记录数：</p>
            </div>

            <div class="error-box" id="errorBox">
                <p id="errorMsg">❌ 解析失败，请检查数据是否正确</p>
            </div>

            <button class="btn btn-primary" id="downloadBtn" onclick="downloadExcel()" style="display: none;">⬇️ 下载 Excel 文件</button>
            
            <button class="btn" onclick="document.getElementById('inputSection').style.display='block';" style="width: 100%; margin-top: 12px; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; display: none;" id="retryBtn">� 手动重试</button>

            <p class="hint">
                <a href="index.html">← 返回出库管理系统</a>
            </p>
        </div>
    </div>

    <script>
// 存储解析后的记录数据
let parsedRecords = null;

// 从URL hash中获取文件数据
window.addEventListener('DOMContentLoaded', function() {
    const hash = window.location.hash;
    if (hash) {
        // 支持新格式：#d=压缩后的记录数据
        if (hash.startsWith('#d=')) {
            const compressedData = hash.substring(3);
            try {
                // 使用LZString解压
                const jsonStr = LZString.decompressFromEncodedURIComponent(compressedData);
                const records = JSON.parse(jsonStr);
                parsedRecords = records;
                displayFileInfo(records);
                // 显示下载按钮
                document.getElementById('downloadBtn').style.display = 'block';
            } catch (e) {
                console.error('解压失败:', e);
                showError('链接解析失败：' + e.message);
                document.getElementById('retryBtn').style.display = 'block';
            }
        } else {
            // 没有hash，显示手动输入区域
            document.getElementById('inputSection').style.display = 'block';
        }
    } else {
        // 没有hash，显示手动输入区域
        document.getElementById('inputSection').style.display = 'block';
    }
});

// 显示文件信息
function displayFileInfo(records) {
    const fileInfo = document.getElementById('fileInfo');
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.remove('show');
    fileInfo.classList.add('show');
    
    const totalCount = records.length;
    const totalCardNumber = records.reduce((sum, r) => sum + (r[2] * r[3]), 0);
    
    document.getElementById('fileName').textContent = '文件名：全部出库记录.xlsx';
    document.getElementById('fileSize').textContent = `共 ${totalCount} 条记录 | 总卡数：${totalCardNumber}`;
    
    // 隐藏提示框
    document.getElementById('infoBox').style.display = 'none';
}

// 生成Excel并下载
function downloadExcel() {
    if (!parsedRecords || parsedRecords.length === 0) {
        showError('没有可下载的记录');
        return;
    }

    try {
        // 转换为原始格式
        const records = parsedRecords.map(r => ({
            id: r[0],
            productName: r[1],
            cardNumber: r[2],
            quantity: r[3],
            createTime: r[4]
        }));

        const totalCardNumber = records.reduce((sum, r) => sum + (r.cardNumber * r.quantity), 0);

        const wb = XLSX.utils.book_new();
        
        const data = [
            ['全部出库记录汇总表'],
            [],
            ['序号', '品名', '卡数', '数量', '出库时间']
        ];

        records.forEach((record, index) => {
            data.push([
                index + 1,
                record.productName,
                record.cardNumber,
                record.quantity,
                record.createTime
            ]);
        });

        data.push([]);
        data.push(['', '总卡数：', totalCardNumber, '', '']);
        data.push(['', '记录数：', records.length, '', '']);

        const ws = XLSX.utils.aoa_to_sheet(data);

        ws['!cols'] = [
            { wch: 8 },
            { wch: 20 },
            { wch: 10 },
            { wch: 10 },
            { wch: 20 }
        ];

        ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];

        XLSX.utils.book_append_sheet(wb, ws, '全部出库记录');

        const fileName = '全部出库记录_' + new Date().toISOString().split('T')[0] + '.xlsx';
        
        // 下载文件
        XLSX.writeFile(wb, fileName);
        
    } catch (error) {
        showError('生成Excel失败：' + error.message);
        console.error(error);
    }
}

// 手动粘贴解析
function parseAndDownload() {
    const input = document.getElementById('base64Input').value.trim();
    
    if (!input) {
        showError('请先粘贴数据');
        return;
    }

    try {
        // 尝试解压
        let jsonStr;
        if (input.startsWith('d=')) {
            jsonStr = LZString.decompressFromEncodedURIComponent(input.substring(2));
        } else {
            jsonStr = LZString.decompressFromEncodedURIComponent(input);
        }
        
        parsedRecords = JSON.parse(jsonStr);
        displayFileInfo(parsedRecords);
        // 显示下载按钮
        document.getElementById('downloadBtn').style.display = 'block';
        document.getElementById('inputSection').style.display = 'none';
    } catch (error) {
        showError('解析失败：' + error.message);
    }
}

// 显示错误
function showError(msg) {
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = '❌ ' + msg;
    errorBox.classList.add('show');
    
    setTimeout(() => {
        errorBox.classList.remove('show');
    }, 5000);
}
    </script>
</body>
</html>
